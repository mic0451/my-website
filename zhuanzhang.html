<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>轉帳 - 交易結果</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #f5f5f7;
      color: #1c1c1e;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    /* 截圖外框容器 */
    #captureRoot {
      background: #f5f5f7;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }
    .status-bar {
      height: 44px;
      background: #40c4b0;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 20px 8px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      position: relative;
      z-index: 10;
    }
    .status-bar .time {
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.3px;
    }
    .status-bar .icons {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .status-bar .icons svg { display: block; }
    .header {
      background: #40c4b0;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      color: #fff;
    }
    .header-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .info-bar {
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      font-size: 13px;
      color: #8e8e93;
      border-bottom: 0.5px solid rgba(0,0,0,0.08);
    }
    .info-bar .leave {
      color: #1c1c1e;
      font-weight: 500;
      cursor: pointer;
    }
    .content {
      background: #fff;
      min-height: calc(100vh - 44px - 48px - 42px);
      padding: 28px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .section-title {
      font-size: 17px;
      font-weight: 600;
      color: #1c1c1e;
      margin-bottom: 20px;
      letter-spacing: 0.3px;
    }
    .divider {
      width: 100%;
      max-width: 340px;
      border: none;
      border-top: 1.5px dashed #c7c7cc;
      margin-bottom: 22px;
    }
    .success-label {
      font-size: 16px;
      font-weight: 500;
      color: #40c4b0;
      margin-bottom: 18px;
      align-self: flex-start;
      padding-left: 4px;
      max-width: 340px;
      width: 100%;
    }
    .card {
      width: 100%;
      max-width: 340px;
      background: #fff;
      border-radius: 12px;
      /* 使用真實邊框，避免 html2canvas 丟失 box-shadow 外框 */
      border: 1px solid #e0e0e0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      overflow: hidden;
      margin-bottom: 28px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: nowrap;
      padding: 13px 16px;
      font-size: 15px;
      line-height: 1.35;
      border-bottom: 0.5px solid rgba(0,0,0,0.06);
    }
    .row:last-child { border-bottom: none; }
    .row .label {
      color: #8e8e93;
      flex-shrink: 0;
      margin-right: 12px;
      white-space: nowrap;
    }
    .row .value {
      color: #1c1c1e;
      text-align: right;
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .row .value.with-eye {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .eye-icon {
      width: 18px;
      height: 18px;
      opacity: 0.55;
      flex-shrink: 0;
    }
    /* 可點擊編輯（時間除外） */
    [contenteditable="true"] {
      outline: none;
      cursor: text;
      border-radius: 4px;
      -webkit-user-modify: read-write-plaintext-only;
    }
    [contenteditable="true"]:focus {
      background: rgba(64, 196, 176, 0.12);
      box-shadow: 0 0 0 1px rgba(64, 196, 176, 0.35);
    }
    .header-title[contenteditable="true"]:focus {
      background: rgba(255,255,255,0.2);
      box-shadow: none;
    }
    .btn[contenteditable="true"] {
      cursor: text;
    }
    .btn-group {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s ease;
      letter-spacing: 0.3px;
      -webkit-appearance: none;
      appearance: none;
    }
    .btn:active { opacity: 0.75; }
    .btn-primary, .btn-secondary {
      background: #40c4b0;
      color: #fff;
    }
    .home-indicator {
      position: fixed;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: #1c1c1e;
      border-radius: 100px;
      opacity: 0.2;
    }
    @supports (padding: max(0px)) {
      .status-bar {
        padding-top: env(safe-area-inset-top);
        height: calc(44px + env(safe-area-inset-top));
      }
      body { padding-bottom: env(safe-area-inset-bottom); }
    }
    .screenshot-btn {
      position: fixed;
      right: 16px;
      bottom: 28px;
      z-index: 9999;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: #40c4b0;
      color: #fff;
      box-shadow: 0 4px 12px rgba(64, 196, 176, 0.45);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-appearance: none;
      appearance: none;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .screenshot-btn:active {
      opacity: 0.85;
      transform: scale(0.94);
    }
    .screenshot-btn svg {
      display: block;
      pointer-events: none;
    }
    .screenshot-btn.capturing {
      visibility: hidden;
      pointer-events: none;
    }
    .screenshot-toast {
      position: fixed;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.78);
      color: #fff;
      font-size: 14px;
      padding: 10px 18px;
      border-radius: 20px;
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      white-space: nowrap;
    }
    .screenshot-toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="captureRoot">
  <div class="status-bar">
    <div class="time" id="statusTime">--:--</div>
    <div class="icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
        <rect x="0" y="8" width="3" height="4" rx="0.5" fill="white"/>
        <rect x="4.5" y="5.5" width="3" height="6.5" rx="0.5" fill="white"/>
        <rect x="9" y="3" width="3" height="9" rx="0.5" fill="white"/>
        <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="white"/>
      </svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
        <path d="M8 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z" fill="white"/>
        <path d="M4.2 7.3a5.5 5.5 0 0 1 7.6 0" stroke="white" stroke-width="1.4" stroke-linecap="round" fill="none"/>
        <path d="M1.5 4.5a9 9 0 0 1 13 0" stroke="white" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
        <rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="white" stroke-opacity="0.4" stroke-width="1"/>
        <rect x="2" y="2" width="17" height="8" rx="1.5" fill="white"/>
        <path d="M23 4v4a2 2 0 0 0 0-4z" fill="white" fill-opacity="0.4"/>
      </svg>
    </div>
  </div>
  <div class="header">
    <div class="header-title" contenteditable="true">轉帳</div>
  </div>
  <div class="info-bar">
    <span>資料時間：<span id="dataTime">----/--/-- --:--:--</span></span>
    <span class="leave" contenteditable="true">離開</span>
  </div>
  <div class="content">
    <div class="section-title" contenteditable="true">交易結果</div>
    <hr class="divider">
    <div class="success-label" contenteditable="true">交易成功</div>
    <div class="card">
      <div class="row">
        <span class="label" contenteditable="true">交易時間</span>
        <span class="value" id="txTime">----/--/-- --:--:--</span>
      </div>
      <div class="row">
        <span class="label" contenteditable="true">轉出帳號</span>
        <span class="value" contenteditable="true">南台南分行 072508054509</span>
      </div>
      <div class="row">
        <span class="label" contenteditable="true">轉入銀行</span>
        <span class="value" contenteditable="true">華南銀行</span>
      </div>
      <div class="row">
        <span class="label" contenteditable="true">轉入帳號</span>
        <span class="value" contenteditable="true">台灣宅配通 0000240201055816</span>
      </div>
      <div class="row">
        <span class="label" contenteditable="true">交易金額</span>
        <span class="value" contenteditable="true">新台幣 $2000 元</span>
      </div>
      <div class="row">
        <span class="label" contenteditable="true">手續費</span>
        <span class="value" contenteditable="true">新台幣 $15 元</span>
      </div>
      <div class="row">
        <span class="label" contenteditable="true">轉出帳號餘額</span>
        <span class="value with-eye">
          <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <span contenteditable="true">新台幣 $256,850 元</span>
        </span>
      </div>
      <div class="row">
        <span class="label" contenteditable="true">交易類別</span>
        <span class="value" contenteditable="true">即時轉帳-非約定帳戶</span>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" contenteditable="true">通知收款人</button>
      <button class="btn btn-secondary" contenteditable="true">回首頁</button>
    </div>
  </div>
  <button type="button" class="screenshot-btn" id="screenshotBtn" title="截圖" aria-label="截圖">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
  </button>
  <div class="screenshot-toast" id="screenshotToast">截圖已儲存</div>
  <div class="home-indicator"></div>
  </div><!-- /captureRoot -->
  <script>
    function pad(n) {
      return n < 10 ? '0' + n : '' + n;
    }
    function formatStatusTime(d) {
      return pad(d.getHours()) + ':' + pad(d.getMinutes());
    }
    function formatFullTime(d) {
      return d.getFullYear() + '/' +
             pad(d.getMonth() + 1) + '/' +
             pad(d.getDate()) + ' ' +
             pad(d.getHours()) + ':' +
             pad(d.getMinutes()) + ':' +
             pad(d.getSeconds());
    }
    function updateTimes() {
      var now = new Date();
      document.getElementById('statusTime').textContent = formatStatusTime(now);
      document.getElementById('dataTime').textContent = formatFullTime(now);
      document.getElementById('txTime').textContent = formatFullTime(now);
    }
    updateTimes();
    setInterval(updateTimes, 1000);

    // 防止 contenteditable 按鈕觸發預設行為
    document.querySelectorAll('.btn[contenteditable="true"]').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        if (document.activeElement === btn) return;
        e.preventDefault();
        btn.focus();
      });
    });

    function showToast(msg) {
      var toast = document.getElementById('screenshotToast');
      toast.textContent = msg || '截圖已儲存';
      toast.classList.add('show');
      setTimeout(function() { toast.classList.remove('show'); }, 1800);
    }

    function downloadCanvas(canvas) {
      var link = document.createElement('a');
      var now = new Date();
      var name = '轉帳結果_' +
        now.getFullYear() +
        String(now.getMonth() + 1).padStart(2, '0') +
        String(now.getDate()).padStart(2, '0') + '_' +
        String(now.getHours()).padStart(2, '0') +
        String(now.getMinutes()).padStart(2, '0') +
        String(now.getSeconds()).padStart(2, '0') + '.png';
      link.download = name;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    document.getElementById('screenshotBtn').addEventListener('click', function() {
      var btn = document.getElementById('screenshotBtn');
      var toast = document.getElementById('screenshotToast');
      var home = document.querySelector('.home-indicator');
      var root = document.getElementById('captureRoot') || document.body;

      btn.classList.add('capturing');
      if (home) home.style.visibility = 'hidden';
      toast.classList.remove('show');

      requestAnimationFrame(function() {
        setTimeout(function() {
          if (typeof html2canvas === 'undefined') {
            btn.classList.remove('capturing');
            if (home) home.style.visibility = '';
            showToast('截圖功能載入中，請稍後再試');
            return;
          }

          var w = root.scrollWidth || root.offsetWidth;
          var h = root.scrollHeight || root.offsetHeight;

          html2canvas(root, {
            useCORS: true,
            allowTaint: true,
            backgroundColor: '#f5f5f7',
            scale: Math.min(window.devicePixelRatio || 2, 3),
            width: w,
            height: h,
            windowWidth: w,
            windowHeight: h,
            scrollX: 0,
            scrollY: 0,
            x: 0,
            y: 0,
            foreignObjectRendering: false,
            logging: false,
            onclone: function(clonedDoc) {
              var clonedRoot = clonedDoc.getElementById('captureRoot') || clonedDoc.body;
              clonedRoot.style.background = '#f5f5f7';
              clonedRoot.style.minHeight = h + 'px';
              clonedRoot.style.overflow = 'visible';
              // 隱藏截圖無關元素
              var hi = clonedDoc.querySelector('.home-indicator');
              if (hi) hi.style.display = 'none';
              var sbtn = clonedDoc.getElementById('screenshotBtn');
              if (sbtn) sbtn.style.display = 'none';
              var st = clonedDoc.getElementById('screenshotToast');
              if (st) st.style.display = 'none';
              // 強制卡片外框在截圖中可見（html2canvas 常丟 box-shadow）
              clonedDoc.querySelectorAll('.card').forEach(function(card) {
                card.style.border = '1px solid #d8d8d8';
                card.style.boxShadow = 'none';
                card.style.borderRadius = '12px';
                card.style.background = '#ffffff';
              });
            }
          }).then(function(canvas) {
            downloadCanvas(canvas);
            showToast('截圖已儲存');
          }).catch(function(err) {
            console.error(err);
            showToast('截圖失敗');
          }).finally(function() {
            btn.classList.remove('capturing');
            if (home) home.style.visibility = '';
          });
        }, 80);
      });
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</body>
</html>
